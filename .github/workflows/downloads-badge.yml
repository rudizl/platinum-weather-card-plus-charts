name: 'Downloads badge'

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute downloads and update badge JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq '[.[].assets[] | select(.name=="platinum-weather-card.js") | .download_count] | add // 0')
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"blue"}' "$TOTAL" > badges/downloads.json
          if git diff --quiet badges/downloads.json; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/downloads.json
          git commit -m "Update downloads badge [skip ci]"
          git push
