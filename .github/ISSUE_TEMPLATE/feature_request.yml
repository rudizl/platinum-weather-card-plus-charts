name: Feature request
description: Suggest a new feature or improvement
title: "[FR]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or limitation you're facing
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've tried
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to similar implementations
